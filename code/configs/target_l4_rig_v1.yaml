schema_version: 1
config_id: target_l4_rig_reference_v1
status: reference_preset_pending_organizer_confirmation

vehicle:
  type: L4_low_speed_logistics_vehicle
  length_m: 5.20
  width_m: 2.05
  height_m: 2.00
  source_lidar_height_above_ground_m: 0.50
  operating_domain: urban_road_and_logistics_delivery

coordinate_convention:
  lidar: x_forward_y_left_z_up
  camera: opencv_x_right_y_down_z_forward
  source_external: T_C_L_maps_lidar_points_to_camera
  source_mount: T_L_C_source_equals_inverse_T_C_L_source
  target_mount: T_L_C_target_equals_T_L_R_delta_times_T_L_C_source

rig_delta_from_source_lidar:
  description: >-
    The seven calibrated cameras move as one rigid rig. This preset raises the
    rig by 0.35 m, moves it forward by 0.10 m and pitches it by 2 degrees.
  translation_m: [0.10, 0.00, 0.35]
  roll_pitch_yaw_deg: [0.00, 2.00, 0.00]
  T_L_R_delta_row_major:
    - [0.9993908270190958, 0.0, 0.0348994967025010, 0.10]
    - [0.0, 1.0, 0.0, 0.00]
    - [-0.0348994967025010, 0.0, 0.9993908270190958, 0.35]
    - [0.0, 0.0, 0.0, 1.0]

cameras:
  names:
    - CAM_BACK_LEFT
    - CAM_FRONT_LEFT
    - CAM_FRONT_RIGHT
    - CAM_BACK_RIGHT
    - CAM_BACK
    - CAM_FRONT_WIDE
    - CAM_FRONT_NARROW
  source_calibration: config/camera_config.json
  source_distortion: config/camera_intric.yaml
  relative_mount_policy: preserve_source_seven_camera_rig
  intrinsic_policy: preserve_source_intrinsics_after_undistortion
  processing_resolution: [960, 540]
  output_frame_rate_fps: 2.0

geometry_policy:
  lidar_anchor_priority: highest
  generated_rgb_exports_depth: false
  generated_rgb_se3_eligible: false
  visual_and_geometric_outputs_are_separate: true

limitations:
  - This is a team-defined reference target because no authoritative target vehicle calibration has been supplied.
  - Per-camera relative mounts and intrinsics are preserved from the source rig.
  - Replace this preset if the organizer supplies target vehicle dimensions, camera mounts or intrinsics.
